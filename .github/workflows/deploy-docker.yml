name: Deploy Standalone App

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  APP_NAME: ocr_app
  IMAGE_NAME: ocr_app
  DEPLOY_DIR: /home/balabantaray-user/ocr_app   # ✅ FIXED
  APP_PORT: 9000

jobs:
  deploy-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout Code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Prepare Code for Transfer
      # --------------------------------------------------
      - name: Create project archive
        run: |
          # ✅ Use current dir instead of /opt
          tar --exclude='.git' -czf project_code.tar.gz .

      # --------------------------------------------------
      # 3. Setup SSH
      # --------------------------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST=$(echo "${{ secrets.SERVER_HOST }}" | tr -d '\n\r' | xargs)
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # 4. Upload Code to Server
      # --------------------------------------------------
      - name: Upload code to server
        run: |
          PORT=${{ secrets.SERVER_PORT }}
          [ -z "$PORT" ] && PORT=22

          HOST=$(echo "${{ secrets.SERVER_HOST }}" | tr -d '\n\r' | xargs)

          echo "Uploading code to $HOST:$DEPLOY_DIR ..."

          # Create directory in HOME (no sudo needed)
          ssh -i ~/.ssh/deploy_key -p $PORT \
            balabantaray-user@$HOST "mkdir -p $DEPLOY_DIR"

          # Upload tar
          scp -i ~/.ssh/deploy_key -P $PORT \
            project_code.tar.gz \
            balabantaray-user@$HOST:$DEPLOY_DIR/project_code.tar.gz

      # --------------------------------------------------
      # 5. Remote Build and Deploy
      # --------------------------------------------------
      - name: Build and Deploy on Server
        run: |
          PORT=${{ secrets.SERVER_PORT }}
          [ -z "$PORT" ] && PORT=22

          HOST=$(echo "${{ secrets.SERVER_HOST }}" | tr -d '\n\r' | xargs)

          ssh -i ~/.ssh/deploy_key -p $PORT "balabantaray-user@${HOST}" << 'EOF'
            set -e

            APP_NAME="ocr_app"
            IMAGE_NAME="ocr_app"
            DEPLOY_DIR="/home/balabantaray-user/ocr_app"
            PORT="9000"

            cd "$DEPLOY_DIR"

            # --------------------------------------------------
            # A. Extract Code
            # --------------------------------------------------
            echo "Extracting new code..."
            tar -xzf project_code.tar.gz
            rm project_code.tar.gz

            # --------------------------------------------------
            # B. Check for Models
            # --------------------------------------------------
            if [ ! -d "models" ]; then
              echo "⚠️ WARNING: models folder missing"
            else
              echo "✅ Models folder found"
            fi

            # --------------------------------------------------
            # C. Build Docker Image
            # --------------------------------------------------
            echo "Building Docker image..."
            docker build -t $IMAGE_NAME:latest .

            # --------------------------------------------------
            # D. Stop Old Container
            # --------------------------------------------------
            echo "Stopping old container..."
            docker rm -f $APP_NAME 2>/dev/null || true

            # --------------------------------------------------
            # E. Run New Container
            # --------------------------------------------------
            echo "Starting new container..."
            docker run -d \
              --gpus all \
              --name $APP_NAME \
              --restart unless-stopped \
              -p $PORT:9000 \
              $IMAGE_NAME:latest

            # --------------------------------------------------
            # F. Cleanup
            # --------------------------------------------------
            echo "Cleaning unused Docker data..."
            docker system prune -f

            echo "✅ Deployment Complete!"
          EOF
